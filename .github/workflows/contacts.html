<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lose_Contro1 - Контакты</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(360deg, #0d0121, #15004b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            background: #12121c;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), 0 0 60px rgba(255, 0, 128, 0.1);
            overflow: hidden;
            border: 1px solid #222235;
        }

        /* Навигационное меню */
        .site-nav {
            display: flex;
            justify-content: center;
            background: #18002c;
            border-bottom: 2px solid #222235;
            padding: 15px 0;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-btn:hover {
            color: #00ffff;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .nav-btn.active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 15px #00ffff;
        }

        .content-wrapper {
            display: flex;
            width: 100%;
        }

        /* Блок контактов (вместо профиля) */
        .contact-card {
            flex: 1;
            background: linear-gradient(145deg, #18002c 0%, #00122c 50%, #16006c 100%);
            color: #fff;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        .page-title {
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .page-tag {
            font-size: 14px;
            color: #00d0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 35px;
            text-shadow: 0 0 8px #00d0ff;
            text-align: center;
        }

        .info-section {
            width: 100%;
            text-align: left;
            margin-bottom: 25px;
        }

        .info-title {
            font-size: 14px;
            color: #00d5ff;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
            border-bottom: 2px solid #00d5ff;
            padding-bottom: 4px;
            text-shadow: 0 0 5px rgba(0, 187, 255, 0.4);
        }

        /* Список контактов */
        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #e2e2e2;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-item:hover {
            color: #00ffff;
        }

        .contact-label {
            font-weight: bold;
            color: #00d5ff;
            min-width: 100px;
        }

        /* Форма обратной связи */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-input, .form-textarea {
            background: rgba(18, 18, 28, 0.7);
            border: 1px solid #222235;
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            background: #00d5ff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #006eff;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #00ffff;
            box-shadow: 0 0 15px #00ffff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Меню переключения страниц -->
        <nav class="site-nav">

            <a href="contacts.html" class="nav-btn active">Контакты</a>
        </nav>

        <div class="content-wrapper">

                <div class="info-section">

                            <span class="contact-label">DevianArt:</span> UnknownArchist
                        </a>
                       <a target="_blank" class="contact-item">
                            <span class="contact-label">Telephone:</span> +79921872653
                    </div>
                </div>
</body>
</html>
