<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lose_Contro1 - Главная</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(360deg, #0d0121, #15004b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            background: #12121c;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), 0 0 60px rgba(255, 0, 128, 0.1);
            overflow: hidden;
            border: 1px solid #222235;
        }

        /* Навигационное меню */
        .site-nav {
            display: flex;
            justify-content: center;
            background: #18002c;
            border-bottom: 2px solid #222235;
            padding: 15px 0;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-btn:hover {
            color: #00ffff;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .nav-btn.active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 15px #00ffff;
        }

        .content-wrapper {
            display: flex;
            width: 100%;
        }

        .profile-card {
            flex: 1;
            background: linear-gradient(145deg, #18002c 0%, #00122c 50%, #16006c 100%);
            color: #fff;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00d5ff;
            box-shadow: 0 0 15px #00aeff;
            margin-bottom: 20px;
        }

        .profile-name {
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .profile-tag {
            font-size: 14px;
            color: #00d0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 8px #00d0ff;
        }

        .info-section {
            width: 100%;
            text-align: left;
            margin-bottom: 25px;
        }

        .info-title {
            font-size: 14px;
            color: #00d5ff;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
            border-bottom: 2px solid #00d5ff;
            padding-bottom: 4px;
            text-shadow: 0 0 5px rgba(0, 187, 255, 0.4);
        }

        .info-content {
            font-size: 15px;
            line-height: 1.6;
            color: #e2e2e2;
        }

        .software-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            background-color: #00d0ff; 
            box-shadow: 0 0 8px #006eff; 
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Меню переключения страниц -->
        <nav class="site-nav">
            <a href="index.html" class="nav-btn active">Главная</a>
            <a href="portfolio.html" class="nav-btn">Портфолио</a>
            <a href="contacts.html" class="nav-btn">Контакты</a>
        </nav>

        <div class="content-wrapper">
            <div class="profile-card">
                <img src="https://i.ibb.co/tTHSBSDQ/Oc-5.png" alt="Bobrovskiy Pavel" class="profile-img">
                <h1 class="profile-name">BOBROVSKIY PAVEL</h1>
                <div class="profile-tag">Graphics designer / Artist</div>

                <div class="info-section">
                    <div class="info-title">Description</div>
                    <div class="info-content">
                        Graphic Designer & Artist. Turning abstract ideas into bold visual realities. Specializing in Branding, Illustration, and Visual Identity.
                    </div>
                </div>

                <div class="info-section">
                    <div class="info-title">Programs i am working on</div>
                    <div class="software-tags">
                        <span class="tag">Photoshop</span>
                        <span class="tag">AdobeXD</span>
                        <span class="tag">Illustrator</span>
                        <span class="tag">After Effects</span>
                        <span class="tag">Krita</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
